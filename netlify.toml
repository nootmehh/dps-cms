[[redirects]]
  from = "https://dps-cms.netlify.app/*"
  to = "https://cms.dpsmarkajalan.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://dps-cms.netlify.app/*"
  to = "https://cms.dpsmarkajalan.com/:splat"
  status = 301
  force = true

# Cache static Next.js assets aggressively (1 year immutable)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache SVG mask icons
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
